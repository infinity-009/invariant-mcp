[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "invariant-mcp"
version = "0.2.0"
description = "Deterministic pre-flight invariant gates, SARIF static verification, and SHA-256 tamper-evident execution receipts for autonomous coding agents (OpenAI Codex, Claude Code, MCP)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Mallikarjuna Reddy", email = "hello@mallikarjunreddy.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "ai-safety",
    "codex",
    "claude-code",
    "static-analysis",
    "sarif",
    "verification",
    "invariants",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/infinity-009/invariant-mcp"
Repository = "https://github.com/infinity-009/invariant-mcp"
Issues = "https://github.com/infinity-009/invariant-mcp/issues"
Documentation = "https://github.com/infinity-009/invariant-mcp#readme"

[project.scripts]
invariant-gate = "invariant_mcp.cli:app"
invariant-mcp = "invariant_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 105
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]
